backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "essays"
    label: "Essays"
    folder: "content/essays"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", format: "MMMM DD, YYYY", date_format: "MMMM DD, YYYY", time_format: false }
      - { label: "Category", name: "category", widget: "select", options: ["Psychology", "Leadership & Strategy", "Meaningful Living", "Systems Thinking"] }
      - { label: "Summary", name: "summary", widget: "text", hint: "One or two sentences shown on the homepage" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false, hint: "Show this essay on the homepage" }
